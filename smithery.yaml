build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - issuer_id
      - key_id
      - private_key
      - vendor_number
    properties:
      issuer_id:
        type: string
        title: Issuer ID
        description: UUID from App Store Connect → Users and Access → Integrations → Team Keys
      key_id:
        type: string
        title: Key ID
        description: 10-character key ID from App Store Connect API keys page
      private_key:
        type: string
        title: Private Key (.p8 content)
        description: Full content of your .p8 file including -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines
      vendor_number:
        type: string
        title: Vendor Number
        description: Your App Store vendor number (App Store Connect → Sales and Trends → Reports)
      app_id:
        type: string
        title: Default App ID (optional)
        description: Bundle ID (e.g. com.example.app) or numeric App Store ID. If omitted, call select_app() first.
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["server.py"],
      env: {
        APPSTORE_ISSUER_ID: config.issuer_id,
        APPSTORE_KEY_ID: config.key_id,
        APPSTORE_PRIVATE_KEY: config.private_key,
        APPSTORE_VENDOR_NUMBER: config.vendor_number,
        ...(config.app_id ? { APPSTORE_APP_ID: config.app_id } : {})
      }
    })
