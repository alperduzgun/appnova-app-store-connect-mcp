name: appnova-app-store-connect-mcp
description: App Store Connect MCP server for Claude — ASO, reviews, sales, TestFlight, and more.
license: MIT
runtime: python
command: python server.py
config:
  - name: APPSTORE_ISSUER_ID
    description: Issuer ID (UUID) from App Store Connect → Users and Access → Integrations
    required: true
  - name: APPSTORE_KEY_ID
    description: Key ID (10 chars) from App Store Connect API keys page
    required: true
  - name: APPSTORE_PRIVATE_KEY
    description: Full content of your .p8 private key file (including BEGIN/END lines)
    required: true
    secret: true
  - name: APPSTORE_VENDOR_NUMBER
    description: Vendor number for sales and finance reports
    required: true
  - name: APPSTORE_APP_ID
    description: Default app — bundle ID (e.g. com.example.app) or numeric ID. Optional.
    required: false
